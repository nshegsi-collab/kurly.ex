<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내비연습2</title>
  <!--폰트어썸 CDN-->
  <script src="https://kit.fontawesome.com/b197bbc13c.js" crossorigin="anonymous"></script>
  <style>
    @import url(css/reset.css);

    nav{
      width:100%;
      min-width:1080px;
      background-color:#333;
    }
    nav > .container{
      width:1080px;
      margin:auto;
      padding:40px 20px;
      box-sizing:border-box;
    }
    .gnb{
      float:left;
    }
    .gnb > li{
      float:left;
      margin-right:60px;
    }
    .gnb > li > a{
      color:#fff;
      line-height:40px;
    }
    .search{
      float:right;
    }
    .search a{
      color:#fff;
      font-size:20px;
      line-height:40px;
    }
  </style>
</head>
<body>
  <nav>
    <div class="container clear">
      <ul class="gnb">
        <li><a href="#">SHAMMAH</a></li>
        <li><a href="#">ABOUT</a></li>
        <li><a href="#">NEWS</a></li>
        <li><a href="#">PORTFOLIO</a></li>
        <li><a href="#">BOARD</a></li>
        <li><a href="#">ALBUM</a></li>
        <li><a href="#">CONTACT</a></li>
      </ul>
      <div class="search">
        <a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>
      </div>
    </div>
  </nav>
</body>
</html>
