<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블록요소의 가운데정렬</title>
  <style>
    section{
      border:5px dotted gray;
    }
    section > div{
      width:100px;
      height:100px;
      background-color:red;
      margin-left:0;/*이 코드는 사실 쓸 필요는 없다 왜냐하면 초기값이 0이니까*/
    }
    section > div:nth-child(3){
      background-color:green;
      margin-left:auto;
    }
    section > div:nth-child(2){
      background-color:gold;
      margin-left:auto;
      margin-right:auto;
      /*축약형*/
      margin:auto;/*블록요소를 가운데 정렬하는 방법*/
    }
  </style>
</head>
<body>
  <section>
    <div></div>
    <div></div>
    <div></div>
  </section>
</body>
</html>
