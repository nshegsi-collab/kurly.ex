<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마우스이벤트</title>
  <style>
    /*기본 링크 값*/
    a:link{
      color:#333;
      text-decoration: none;/*밑줄 제거*/
    }
    /*방문한 링크*/
    a:visited{
      color:#6c3;
    }
    /*해당 요소에 마우스를 올렸을때*/
    a:hover{
      background-color:hotpink;
      color:#fff;
    }
    /*해당 요소를 클릭했을때*/
    a:active{
      color:#f00;
      background-color:transparent;/*투명(기본값)*/
    }
  </style>
</head>
<body>

    <li><a href="https://www.moviechart.co.kr/info/movieinfo/detail/20250654" target="_blank">4.오디세이</a></li>

  </ul>
</body>
</html>
