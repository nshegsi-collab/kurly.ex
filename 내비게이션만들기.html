<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내비게이션 만들기</title>
  <style>
    /*노말라이즈 : 요소 초기화*/
    body{margin:0;}
    ul, li{
      list-style:none;
      margin:0;
      padding:0;
    }
    a{
      text-decoration: none;
    }
    /*클리어픽스핵*/
    .clear::after{/*.clear요소의 마지막 자손으로 가상요소를 생성*/
      content:"";
      display:block;
      clear:both;
    }
    /*=================================*/
    /*타이틀*/
    .title{text-align: center;}
    
    /*메뉴 박스*/
    .menu-box{
      margin-top:50px;
      text-align: center;
    }
    .menu-box > .menu{
      background-color:#ccc;
      width:800px;
      margin:auto;/*블럭요소의 가운데 정렬*/
    }
    .menu > li{
      width:200px;
      float:left;
    }
    .menu > li > a{
      display:block;
      color:#111;
      width:100%;
      height:50px;
      line-height:50px;
    }
    /*메뉴에 마우스를 올리면 적용*/
    .menu > li > a:hover{
      background-color:tomato;
      color:#fff;
    }

  </style>
</head>
<body>
  <h1 class="title">menu-box</h1>
  <nav class="menu-box">
    <ul class="menu clear">
      <li><a href="#">메뉴 아이템 1</a></li>
      <li><a href="#">메뉴 아이템 2</a></li>
      <li><a href="#">메뉴 아이템 3</a></li>
      <li><a href="#">메뉴 아이템 4</a></li>
    </ul>
  </nav>
</body>
</html>
