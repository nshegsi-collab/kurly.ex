<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내비연습1</title>
  <!--폰트어썸 CDN-->
  <script src="https://kit.fontawesome.com/b197bbc13c.js" crossorigin="anonymous"></script>
  <style>
    /*외부문서 링크*/
    @import url(css/reset.css);

    nav{
      width:100%;
      /*최소 넓이 설정*/
      min-width:1080px;
      background-color:orangered;
    }
    nav > .container{
      width:1080px;
      margin:auto;
    }
    nav .logo{
      float:left;
      font-size:30px;
      line-height:40px;
    } 
    nav .logo a{
      color:#fff;
    }
    nav .logo a:hover{
      color:chartreuse;
    }
    nav .gnb{
      float:right;
    }
    nav .gnb > li{
      float:left;
      margin-left:60px;
    }
    nav .gnb > li > a{
      color:#fff;
      line-height:40px;
    }
    nav .gnb > li > a:hover{
      color:chartreuse;
    }
  </style>
</head>
<body>
  <nav>
    <div class="container clear">
      
      <div class="logo"><a href="#">
        <i class="fa-brands fa-apple"></i>
      </a></div>

      <ul class="gnb">
        <li><a href="#">ABOUT</a></li>
        <li><a href="#">NEWS</a></li>
        <li><a href="#">PORTFOLIO</a></li>
        <li><a href="#">BOARD</a></li>
        <li><a href="#">ALBUM</a></li>
        <li><a href="#">CONTACT</a></li>
      </ul>

    </div>
  </nav>
</body>
</html>
