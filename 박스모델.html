<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>박스모델</title>
  <style>
    .box{
      background-color:orange;
      width:100px;
      height:100px;
      /*바깥쪽 여백*/
      margin-left:50px;
      margin-right:50px;
      margin-bottom:50px;
      margin-top:50px;
      /*상하좌우*/
      margin:50px;
      /*상하, 좌우*/
      margin:50px 50px;
      /*상, 좌우, 하*/
      margin:50px 50px 50px;
      /*상, 우, 하, 좌*/
      margin:50px 50px 50px 50px;

      /*안쪽 여백 : 활용 방법은 margin과 동일*/
      padding:50px;
      /*테두리 선*/
      border-width:25px;
      border-style:solid;
      border-color:red;
      /*축약형 : 두께 모양 색상*/
      border:25px solid red;
    }
  </style>
</head>
<body>
  <!--
  box를 이루고 있는 요소

  - content : 요소가 담고 있는 내용
  - padding : content와 border 사이의 간격
  - border : 테두리 선
  - margin: border와 다른 요소 사이의 간격
  -->
  <div class="box">Content</div>
  <div class="box">Content</div>
</body>
</html>
