<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS시작하기</title>
  <!--2. 내부정의 : style태그로 적용하는 방법-->
  <style>
    h1{
      color:red;
    }
  </style>
  <!--3. 외부정의 : 외부문서를 통해 style을 적용하는 방법-->
  <link href="css/style.css" rel="stylesheet">
</head>
<!--1. 인라인 정의 : 요소에 직접 style을 적용하는 방법-->
<body style="background-color:skyblue;">
  <h1>CSS시작하기</h1>
</body>
</html>
